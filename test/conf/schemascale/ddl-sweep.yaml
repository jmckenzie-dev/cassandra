# Step 8 run 4: DDL throughput sweep from the saved 10k schema, 2000 more tables per run, in process mode.
# Set the client count per run:
#   for n in 1 2 4 8 16; do
#     test/bin/schema-scale --profile ddl-sweep --variant stock --mode process --spread 1 --set rampTables.ddlConcurrency=$n
#   done
# steps.csv has ddl_concurrency and ddl_per_s. The node gets a 30 s wall profile right at the start of the
# DDL (steps/t0010000/node-wall.jfr). captureRestart is off, so no restart disturbs the timing.
name: ddl-sweep
variants:
  stock: {}
node:
  tables_warn_threshold: -1
  tables_fail_threshold: -1
  keyspaces_warn_threshold: -1
  columns_per_table_warn_threshold: -1
  columns_per_table_fail_threshold: -1
  max_mutation_size: 16MiB
  metadata_snapshot_frequency: 100
  memtable_heap_space: 2GiB
  memtable_offheap_space: 4GiB

keyspaceSpread: [1]
startFrom: t10000
rampTables: {max: 12000, checkpointEvery: 500, ddlConcurrency: 1, schema: "pk int, c int, v text, PRIMARY KEY (pk, c)"}
stop: {heapPostGcBytes: 25GiB, ddlP99Ms: 600000, snapshotOverMaxMutation: false, rampTimeout: 4h, abortOnBreak: false}
captureAt: [10000]
captureRestart: false
captureFinal: false
profiling: {asyncProfiler: true, histogramEvery: 1000000, snapshotSizeEvery: 5, gcEvery: 1,
            nodeProfiler: mbean, nodeProfileEvents: [wall], nodeProfileSeconds: 30}
