name: ramp-tables
variants:
  stock: {}
node:
  tables_warn_threshold: -1
  tables_fail_threshold: -1
  keyspaces_warn_threshold: -1
  columns_per_table_warn_threshold: -1
  columns_per_table_fail_threshold: -1
  max_mutation_size: 16MiB
  metadata_snapshot_frequency: 100
  memtable_heap_space: 2GiB
  memtable_offheap_space: 4GiB

keyspaceSpread: [1, 100]
rampTables: {max: 100000, checkpointEvery: 1000, schema: "pk int, c int, v text, PRIMARY KEY (pk, c)"}
stop: {ddlP99Ms: 5000, heapPostGcFraction: 0.85, snapshotOverMaxMutation: true, rampTimeout: 4h, abortOnBreak: false}

workload: {sampleTables: 1000, rowsPerTable: 10, wideSelectStar: true}
restart: {graceful: true, kill: true}
profiling: {asyncProfiler: true, histogramEvery: 10000, snapshotSizeEvery: 5, gcEvery: 5}
