# Step 8 run 3: cold start from a saved schema, captures only (no DDL), in process mode:
#   test/bin/schema-scale --profile coldstart --variant stock --mode process --spread 1
# The node starts on a copy of logs/schema-snapshots/<schema key>/t10000/ (made by stair-tables-parallel).
# The table schema and spread must match the saved one; the variant may differ. restart.csv gets the
# startFrom startup time and a second cold start from the restart probe. final/ holds the heap dump.
# Another saved count: --set startFrom=t20000 --set rampTables.max=20000 --set 'captureAt=[20000]'
name: coldstart
variants:
  stock: {}
node:
  tables_warn_threshold: -1
  tables_fail_threshold: -1
  keyspaces_warn_threshold: -1
  columns_per_table_warn_threshold: -1
  columns_per_table_fail_threshold: -1
  max_mutation_size: 16MiB
  metadata_snapshot_frequency: 100
  memtable_heap_space: 2GiB
  memtable_offheap_space: 4GiB

keyspaceSpread: [1]
startFrom: t10000
rampTables: {max: 10000, checkpointEvery: 1000, schema: "pk int, c int, v text, PRIMARY KEY (pk, c)"}
stop: {heapPostGcBytes: 25GiB, ddlP99Ms: 600000, snapshotOverMaxMutation: false, rampTimeout: 12h, abortOnBreak: false}
captureAt: [10000]
captureFinal: true
profiling: {asyncProfiler: true, histogramEvery: 1000000, snapshotSizeEvery: 5, gcEvery: 1}
