# Profile definition only: Cassandra does not load or enforce this file yet.
# See conf/README.txt for scope, aliases, and aggregate dependencies.
#
# required: always recorded and exposed; preserve Cassandra's internal inputs.
# optional: enabled metrics that an operator may move to disabled.
# disabled: metrics excluded from exposure and optional recording.
# Internal or enabled-aggregate dependencies can still require backing state.
#
# Names are case-sensitive and apply to every table or keyspace in that family.
# Use canonical names; existing aliases follow the same selection.
# Table includes IndexTable. SSTable-format gauges are included in both scopes.
# Other metric families and unregistered operational statistics are outside scope.

# All known metrics in the covered families are enabled.
mode: allowlist

table:
  # CompressionRatio is retained conservatively for a conditional sizing helper.
  # Coordinator latencies drive speculation; TotalDiskSpaceUsed orders auto-repair.
  required:
